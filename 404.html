<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>שוב – חברת עורכי דין</title>
<script>
// קישור מהודעת וואטסאפ: doc.shoov.co.il/sign/<קוד> → doc.shoov.co.il/sign/#<קוד> (העמוד מעלים את הקוד משורת הכתובת)
(function () {
  var m = location.pathname.match(/^\/sign\/([a-f0-9]{64})\/?$/);
  if (m) location.replace('/sign/#' + m[1]);
  var k = location.pathname.match(/^\/s\/([a-z0-9]{10})\/?$/); // קישור קצר: doc.shoov.co.il/s/<קוד>
  if (k) location.replace('/sign/#' + k[1]);
})();
</script>
<style>body{margin:0;background:#f6f7f9;font:16px/1.6 Arial,sans-serif;color:#0f1624;text-align:center;padding:60px 16px}a{color:#172a4f}</style>
</head>
<body>
<p>הדף לא נמצא.</p>
<p><a href="https://doc.shoov.co.il/">לפנייה למשרד</a></p>
</body>
</html>
